# The core's own checks: every supported Python, the plugin's rendered
# agents against their sources, and the wheel a downstream CRS vendors.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor pyproject.toml declares; a CRS base image may pin it.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: tools the suite drives
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang jq
          clang --version | head -1
      - name: pytest
        run: |
          python -m pip install -q pytest
          python -m pytest -q
      - name: rendered agents match their sources
        run: PYTHONPATH=src python -m cc_fuzzer_core prompts check
      - name: MANIFEST.md5 matches the tree (integrity-check.sh reads it)
        run: PYTHONPATH=src python -m cc_fuzzer_core manifest check

  wheel:
    name: wheel installs and runs with no plugin present
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: build
        run: |
          python -m pip install -q build
          python -m build --wheel
      - name: install into a clean venv and smoke it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q dist/*.whl
          cd /tmp
          /tmp/v/bin/cc-fuzzer --version
          /tmp/v/bin/cc-fuzzer crs triage --help >/dev/null
          /tmp/v/bin/cc-fuzzer intake cull --help >/dev/null
          /tmp/v/bin/python -c "from cc_fuzzer_core import paths; print(paths.data('rules'))"
